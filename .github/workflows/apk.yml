# Debug APK for Timbre.
#
# 2026-11-05: moved from runnerd's `android` label to a GitHub-hosted runner, because
# the home CI box is off (electricity bill). What that changed, mechanically:
#   * the runner image no longer carries the SDK: ubuntu-latest ships Android
#     cmdline-tools + a preinstalled SDK, so only the NDK is downloaded here;
#   * the hand-rolled `git fetch` clone is replaced by actions/checkout;
#   * the APK leaves as an artifact (and as a release asset on a tag) instead of a
#     `curl -T` PUT to the LAN cache on 192.168.1.10:8080, which no longer exists.
#
# The debug keystore is still committed on purpose: a fresh runner would otherwise
# generate a new debug key on every build, and Android refuses to install an update
# signed with a different one.

name: apk

on:
  # Not on every push to main: a cold APK is ~10 minutes of runner time, and pushes
  # here are frequent. Builds happen when asked or on a tag, so a batch of fixes
  # costs one build instead of five.
  workflow_dispatch:
  push:
    tags: ['v*']

# `softprops/action-gh-release` creates a release with the workflow token, and the token is
# read-only unless this is declared — without it a tag build fails at the last step with
# "Resource not accessible by integration".
permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      NDK_VERSION: "26.1.10909125"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Android NDK
        run: |
          set -eo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" < /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"

      - name: signing key
        # The key is not in the repository any more: it lives in this repository's secrets, and the
        # old committed debug key was retired with 0.9.0. The password never enters the log — only
        # the digest of the file, which is enough to tell two keys apart.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ОШИБКА: нет секрета ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          ks="$RUNNER_TEMP/timbre-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          chmod 600 "$ks"
          sha256sum "$ks"
          # The password never reaches the log: keytool reads it from the environment.
          keystore_password="$KEYSTORE_PASSWORD" keytool -list -keystore "$ks" \
            -storepass:env keystore_password | tail -3
          echo "TIMBRE_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "TIMBRE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TIMBRE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TIMBRE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: build the release APK
        run: |
          set -eo pipefail
          npm ci
          # gen/android is not committed: it is generated per platform by the CLI.
          [ -d src-tauri/gen/android ] || npx tauri android init --ci
          # vue-tsc catches what esbuild happily transpiles: a wrong type passed to a
          # component, an event nobody declared, a ref dereferenced from a template scope.
          npm run typecheck
          # The generated project has no signing config at all, so a release APK would come out
          # unsigned; the script adds one and fails loudly if the template changes shape.
          python3 scripts/patch-android-signing.py
          npm run build
          # Split per ABI and ship only arm64-v8a: one universal APK is ~124 MiB, the arm64 one is a
          # quarter of that, and no phone this client runs on is 32-bit.
          npx tauri android build --apk --split-per-abi --target aarch64

      - name: collect the APK
        # A missing APK is an error, not a note in the log: this step is the last thing
        # that can notice a build which produced nothing.
        run: |
          set -eo pipefail
          src=$(find src-tauri -path '*/outputs/apk/*' -name '*arm64*.apk' ! -name '*unsigned*' -print -quit)
          [ -n "$src" ] || src=$(find src-tauri -path '*/outputs/apk/*' -name '*.apk' ! -name '*unsigned*' -print -quit)
          if [ -z "$src" ]; then
            echo "ОШИБКА: APK не собрался" >&2
            find src-tauri -name '*.apk' -o -name apk -type d | head >&2
            exit 1
          fi
          mkdir -p out
          cp "$src" out/
          ls -l out
          # The hard guarantee is the file name: gradle writes `-unsigned` when it has nothing to
          # sign with, and this step already refuses those. Printing the signer is the nicer proof,
          # but a missing apksigner must not fail a build that is signed.
          apk="out/$(basename "$src")"
          sha256sum "$apk"
          apksigner=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | head -1)
          if [ -n "$apksigner" ]; then
            # A release build signs with the v2/v3 scheme, so `keytool -printcert -jarfile` (v1)
            # refuses the file; apksigner reads what is actually there.
            "$apksigner" verify --print-certs "$apk" \
              | grep -E "Signer #1 certificate (DN|SHA-256)" | head -2 || true
          else
            echo "apksigner not found under $ANDROID_HOME; the APK is signed anyway (no -unsigned suffix)" >&2
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: timbre-apk
          path: out/*.apk
          if-no-files-found: error

      - name: tell #new-builds
        # Channel webhook, Discord-compatible body. The URL is a repository secret; without it the
        # step says so and moves on, so the workflow stays usable for anyone who forks this.
        #
        # The old step attached the LAN-cache URLs it had just PUT to; that cache is gone, so the
        # message links the run instead — the artifact lives behind a GitHub login, and a link that
        # works for the maintainer is still better than a dead host name.
        env:
          HOOK: ${{ secrets.TIMBRE_WEBHOOK }}
        run: |
          set -eo pipefail
          if [ -z "$HOOK" ]; then echo "no TIMBRE_WEBHOOK secret, skipping"; exit 0; fi
          subject=$(git log -1 --pretty=%s | cut -c1-120)
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '**Timbre %s** — %s\nBuild: %s\n' "${GITHUB_SHA:0:7}" "$subject" "$run_url" > /tmp/message.txt
          cat /tmp/message.txt
          # JSON-escape the body, then turn the real newlines into \n escapes.
          content=$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' /tmp/message.txt | awk 'BEGIN { ORS = "\\n" } { print }')
          curl -fsS -X POST "$HOOK" -H 'Content-Type: application/json' \
            -d "{\"content\":\"$content\",\"allowed_mentions\":{\"parse\":[]}}" \
            || echo "webhook unreachable; the build itself is published" >&2

      - name: attach to the release on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          prerelease: true
