# Debug APK for Timbre.
#
# 2026-11-05: moved from runnerd's `android` label to a GitHub-hosted runner, because
# the home CI box is off (electricity bill). What that changed, mechanically:
#   * the runner image no longer carries the SDK: ubuntu-latest ships Android
#     cmdline-tools + a preinstalled SDK, so only the NDK is downloaded here;
#   * the hand-rolled `git fetch` clone is replaced by actions/checkout;
#   * the APK leaves as an artifact (and as a release asset on a tag) instead of a
#     `curl -T` PUT to the LAN cache on 192.168.1.10:8080, which no longer exists.
#
# The debug keystore is still committed on purpose: a fresh runner would otherwise
# generate a new debug key on every build, and Android refuses to install an update
# signed with a different one.

name: apk

on:
  # Not on every push to main: a cold APK is ~10 minutes of runner time, and pushes
  # here are frequent. Builds happen when asked or on a tag, so a batch of fixes
  # costs one build instead of five.
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      NDK_VERSION: "26.1.10909125"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Android NDK
        run: |
          set -eo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" < /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"

      - name: debug keystore
        run: |
          set -eo pipefail
          mkdir -p "$HOME/.android"
          cp src-tauri/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          sha256sum "$HOME/.android/debug.keystore"

      - name: build the debug APK
        run: |
          set -eo pipefail
          npm ci
          # gen/android is not committed: it is generated per platform by the CLI.
          [ -d src-tauri/gen/android ] || npx tauri android init --ci
          # vue-tsc catches what esbuild happily transpiles: a wrong type passed to a
          # component, an event nobody declared, a ref dereferenced from a template scope.
          npm run typecheck
          npm run build
          # Split per ABI and ship only arm64-v8a: one universal debug APK is ~124 MiB,
          # the arm64 one is a quarter of that, and no phone this client runs on is 32-bit.
          npx tauri android build --apk --debug --split-per-abi --target aarch64

      - name: collect the APK
        # A missing APK is an error, not a note in the log: this step is the last thing
        # that can notice a build which produced nothing.
        run: |
          set -eo pipefail
          src=$(find src-tauri -path '*/outputs/apk/*' -name '*arm64-v8a*.apk' -print -quit)
          [ -n "$src" ] || src=$(find src-tauri -path '*/outputs/apk/*' -name '*.apk' -print -quit)
          if [ -z "$src" ]; then
            echo "ОШИБКА: APK не собрался" >&2
            find src-tauri -name '*.apk' -o -name apk -type d | head >&2
            exit 1
          fi
          mkdir -p out
          cp "$src" out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: timbre-apk
          path: out/*.apk
          if-no-files-found: error

      - name: tell #new-builds
        # Channel webhook, Discord-compatible body. The URL is a repository secret; without it the
        # step says so and moves on, so the workflow stays usable for anyone who forks this.
        #
        # The old step attached the LAN-cache URLs it had just PUT to; that cache is gone, so the
        # message links the run instead — the artifact lives behind a GitHub login, and a link that
        # works for the maintainer is still better than a dead host name.
        env:
          HOOK: ${{ secrets.TIMBRE_WEBHOOK }}
        run: |
          set -eo pipefail
          if [ -z "$HOOK" ]; then echo "no TIMBRE_WEBHOOK secret, skipping"; exit 0; fi
          subject=$(git log -1 --pretty=%s | cut -c1-120)
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '**Timbre %s** — %s\nBuild: %s\n' "${GITHUB_SHA:0:7}" "$subject" "$run_url" > /tmp/message.txt
          cat /tmp/message.txt
          # JSON-escape the body, then turn the real newlines into \n escapes.
          content=$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' /tmp/message.txt | awk 'BEGIN { ORS = "\\n" } { print }')
          curl -fsS -X POST "$HOOK" -H 'Content-Type: application/json' \
            -d "{\"content\":\"$content\",\"allowed_mentions\":{\"parse\":[]}}" \
            || echo "webhook unreachable; the build itself is published" >&2

      - name: attach to the release on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          prerelease: true
