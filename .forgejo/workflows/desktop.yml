# Desktop bundles: AppImage (Linux) and an NSIS installer (Windows, cross-compiled from Linux).
#
# Same constraints as apk.yml: throwaway VMs, no git in the image, so the clone is plain and
# the artifacts leave as files PUT to the LAN cache. Desktop bundling additionally needs the
# WebKitGTK stack (Linux) or mingw + nsis (Windows) installed inside the job.

name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: [rust]
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target
    steps:
      - name: checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          command -v git >/dev/null ||
            { apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates; }
          auth=$(printf '%s' "${{ github.server_url }}" | sed "s|://|://x-access-token:${TOKEN}@|")
          git init -q .
          git remote add origin "$auth/${{ github.repository }}.git"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin "${{ github.sha }}" && break
            echo "fetch attempt $i failed, retrying" >&2
            sleep 5
          done
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: webkit build dependencies
        run: |
          set -eo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential nodejs npm libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev patchelf file wget curl xz-utils
          pkg-config --modversion webkit2gtk-4.1
          node -v && npm -v

      - name: build the AppImage
        run: |
          set -eo pipefail
          mkdir -p /tmp/ci-logs
          npm ci 2>&1 | tee /tmp/ci-logs/npm.log
          npx tauri build --bundles appimage 2>&1 | tee /tmp/ci-logs/appimage.log

      - name: publish
        run: |
          set -eo pipefail
          src=$(find "${CARGO_TARGET_DIR:-src-tauri/target}" -name '*.AppImage' -print -quit)
          [ -n "$src" ] || { echo "ОШИБКА: AppImage не собрался" >&2; exit 1; }
          ls -l "$src"
          # Forgejo Release is the address that works outside this LAN: the cache at
          # 192.168.1.10 is only reachable from home, and a build link nobody can open is
          # not a build link. Assets land under /releases/download/<tag>/<file>.
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          BROWSER="${{ github.server_url }}/${{ github.repository }}"
          TAG="nightly"
          case "$GITHUB_REF" in refs/tags/*) TAG="${GITHUB_REF#refs/tags/}";; esac
          release_id() {
            rid=$(curl -sS -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG" \
              | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            if [ -z "$rid" ]; then
              rid=$(curl -sS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
                -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"prerelease\":true,\"target_commitish\":\"main\"}" \
                "$API/releases" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            fi
            [ -n "$rid" ] || { echo "ОШИБКА: не удалось создать релиз $TAG" >&2; exit 1; }
            echo "$rid"
          }
          RID=$(release_id)
          put() {
            if curl -fsS -X POST -H "Authorization: token $TOKEN" \
                 -F "attachment=@$1" "$API/releases/$RID/assets?name=$(basename "$1")" >/dev/null 2>&1; then
              echo "$BROWSER/releases/download/$TAG/$(basename "$1")" >> /tmp/published.txt
            else
              echo "ПРЕДУПРЕЖДЕНИЕ: релиз не принял $(basename "$1") — приватный репозиторий или лимит размера" >&2
            fi
          }
          cache="http://192.168.1.10:8080/upload/apk/${GITHUB_SHA:-manual}"
          case "$src" in *.AppImage|*.exe) cache="http://192.168.1.10:8080/upload/desktop/${GITHUB_SHA:-manual}";; esac
          curl -fsS -T "$src" "$cache/$(basename "$src")" && echo "cache: $cache/$(basename "$src")"
          put "$src"
          tail -1 /tmp/published.txt

  windows:
    runs-on: [rust]
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target
    steps:
      - name: checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          command -v git >/dev/null ||
            { apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates; }
          auth=$(printf '%s' "${{ github.server_url }}" | sed "s|://|://x-access-token:${TOKEN}@|")
          git init -q .
          git remote add origin "$auth/${{ github.repository }}.git"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin "${{ github.sha }}" && break
            echo "fetch attempt $i failed, retrying" >&2
            sleep 5
          done
          git checkout -q FETCH_HEAD

      - name: mingw and nsis
        run: |
          set -eo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential nodejs npm mingw-w64 nsis \
            curl ca-certificates
          rustup target add x86_64-pc-windows-gnu
          node -v && npm -v
          x86_64-w64-mingw32-gcc --version | head -1
          makensis -VERSION

      - name: build the installer
        run: |
          set -eo pipefail
          mkdir -p /tmp/ci-logs
          npm ci 2>&1 | tee /tmp/ci-logs/npm.log
          # Debian's nsis is missing Include/Win/RestartManager.nsh, which Tauri's installer
          # script includes; without it makensis aborts on line 27.
          mkdir -p /usr/share/nsis/Include/Win
          curl -fsSL -o /usr/share/nsis/Include/Win/RestartManager.nsh \
            https://raw.githubusercontent.com/kichik/nsis/master/Include/Win/RestartManager.nsh || true
          npx tauri build --target x86_64-pc-windows-gnu --bundles nsis 2>&1 | tee /tmp/ci-logs/nsis.log \
            || {
              echo "ПРЕДУПРЕЖДЕНИЕ: NSIS не собрался — публикую голый exe" >&2
              npx tauri build --target x86_64-pc-windows-gnu --no-bundle 2>&1 | tee -a /tmp/ci-logs/nsis.log
            }

      - name: publish
        run: |
          set -eo pipefail
          src=$(find "${CARGO_TARGET_DIR:-src-tauri/target}" -name '*-setup.exe' -print -quit)
          [ -n "$src" ] || src=$(find "${CARGO_TARGET_DIR:-src-tauri/target}" -name 'timbre.exe' -print -quit)
          [ -n "$src" ] || { echo "ОШИБКА: установщик не собрался" >&2; exit 1; }
          ls -l "$src"
          # Forgejo Release is the address that works outside this LAN: the cache at
          # 192.168.1.10 is only reachable from home, and a build link nobody can open is
          # not a build link. Assets land under /releases/download/<tag>/<file>.
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          BROWSER="${{ github.server_url }}/${{ github.repository }}"
          TAG="nightly"
          case "$GITHUB_REF" in refs/tags/*) TAG="${GITHUB_REF#refs/tags/}";; esac
          release_id() {
            rid=$(curl -sS -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG" \
              | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            if [ -z "$rid" ]; then
              rid=$(curl -sS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
                -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"prerelease\":true,\"target_commitish\":\"main\"}" \
                "$API/releases" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            fi
            [ -n "$rid" ] || { echo "ОШИБКА: не удалось создать релиз $TAG" >&2; exit 1; }
            echo "$rid"
          }
          RID=$(release_id)
          put() {
            if curl -fsS -X POST -H "Authorization: token $TOKEN" \
                 -F "attachment=@$1" "$API/releases/$RID/assets?name=$(basename "$1")" >/dev/null 2>&1; then
              echo "$BROWSER/releases/download/$TAG/$(basename "$1")" >> /tmp/published.txt
            else
              echo "ПРЕДУПРЕЖДЕНИЕ: релиз не принял $(basename "$1") — приватный репозиторий или лимит размера" >&2
            fi
          }
          cache="http://192.168.1.10:8080/upload/apk/${GITHUB_SHA:-manual}"
          case "$src" in *.AppImage|*.exe) cache="http://192.168.1.10:8080/upload/desktop/${GITHUB_SHA:-manual}";; esac
          curl -fsS -T "$src" "$cache/$(basename "$src")" && echo "cache: $cache/$(basename "$src")"
          put "$src"
          tail -1 /tmp/published.txt

      - name: tell #new-builds
        # Channel webhook, Discord-compatible body. The URL is a secret: when it is unset the
        # step does nothing, so the workflow stays usable without one.
        env:
          HOOK: ${{ secrets.TIMBRE_WEBHOOK }}
        run: |
          set -eo pipefail
          if [ -z "$HOOK" ]; then echo "no TIMBRE_WEBHOOK secret, skipping"; exit 0; fi
          if [ ! -s /tmp/published.txt ]; then echo "nothing published, skipping"; exit 0; fi
          subject=$(git log -1 --pretty=%s | cut -c1-120)
          {
            printf '**Timbre %s** — %s\n' "${GITHUB_SHA:0:7}" "$subject"
            while read -r url; do
              case "$url" in
                *.apk) label=APK ;;
                *.AppImage) label=AppImage ;;
                *.exe) label=Windows ;;
                *) label=Build ;;
              esac
              printf '%s: %s\n' "$label" "$url"
            done < /tmp/published.txt
          } > /tmp/message.txt
          cat /tmp/message.txt
          # JSON-escape the body, then turn the real newlines into \n escapes.
          content=$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' /tmp/message.txt | awk 'BEGIN { ORS = "\\n" } { print }')
          curl -fsS -X POST "$HOOK" -H 'Content-Type: application/json' \
            -d "{\"content\":\"$content\",\"allowed_mentions\":{\"parse\":[]}}"
