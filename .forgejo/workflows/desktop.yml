# Desktop bundles: AppImage (Linux) and an NSIS installer (Windows, cross-compiled from Linux).
#
# Same constraints as apk.yml: throwaway VMs, no git in the image, so the clone is plain and
# the artifacts leave as files PUT to the LAN cache. Desktop bundling additionally needs the
# WebKitGTK stack (Linux) or mingw + nsis (Windows) installed inside the job.

name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: [rust]
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target
    steps:
      - name: checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          command -v git >/dev/null ||
            { apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates; }
          auth=$(printf '%s' "${{ github.server_url }}" | sed "s|://|://x-access-token:${TOKEN}@|")
          git init -q .
          git remote add origin "$auth/${{ github.repository }}.git"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin "${{ github.sha }}" && break
            echo "fetch attempt $i failed, retrying" >&2
            sleep 5
          done
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: webkit build dependencies
        run: |
          set -eo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev patchelf file wget curl xz-utils
          pkg-config --modversion webkit2gtk-4.1

      - name: build the AppImage
        run: |
          set -eo pipefail
          mkdir -p /tmp/ci-logs
          npm ci 2>&1 | tee /tmp/ci-logs/npm.log
          npx tauri build --bundles appimage 2>&1 | tee /tmp/ci-logs/appimage.log

      - name: publish
        run: |
          set -eo pipefail
          src=$(find src-tauri/target -name '*.AppImage' -print -quit)
          [ -n "$src" ] || { echo "ОШИБКА: AppImage не собрался" >&2; exit 1; }
          ls -l "$src"
          dest="http://192.168.1.10:8080/upload/desktop/${GITHUB_SHA:-manual}"
          curl -fsS -T "$src" "$dest/$(basename "$src")"
          echo "published $dest/$(basename "$src")"

  windows:
    runs-on: [rust]
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target
    steps:
      - name: checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          command -v git >/dev/null ||
            { apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates; }
          auth=$(printf '%s' "${{ github.server_url }}" | sed "s|://|://x-access-token:${TOKEN}@|")
          git init -q .
          git remote add origin "$auth/${{ github.repository }}.git"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin "${{ github.sha }}" && break
            echo "fetch attempt $i failed, retrying" >&2
            sleep 5
          done
          git checkout -q FETCH_HEAD

      - name: mingw and nsis
        run: |
          set -eo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential mingw-w64 nsis
          rustup target add x86_64-pc-windows-gnu
          x86_64-w64-mingw32-gcc --version | head -1
          makensis -VERSION

      - name: build the installer
        run: |
          set -eo pipefail
          mkdir -p /tmp/ci-logs
          npm ci 2>&1 | tee /tmp/ci-logs/npm.log
          npx tauri build --target x86_64-pc-windows-gnu --bundles nsis 2>&1 | tee /tmp/ci-logs/nsis.log

      - name: publish
        run: |
          set -eo pipefail
          src=$(find src-tauri/target -name '*-setup.exe' -print -quit)
          [ -n "$src" ] || { echo "ОШИБКА: установщик не собрался" >&2; exit 1; }
          ls -l "$src"
          dest="http://192.168.1.10:8080/upload/desktop/${GITHUB_SHA:-manual}"
          curl -fsS -T "$src" "$dest/$(basename "$src")"
          echo "published $dest/$(basename "$src")"
